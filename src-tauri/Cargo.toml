[package]
name = "atogaki-desktop"
version = "0.1.0"
description = "Atogaki local desktop application"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.100"
atogaki-subtitle = { path = ".." }
futures-util = "0.3.31"
flate2 = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite"] }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
urlencoding = "2.1.3"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSGraphics", "NSPanel", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSProcessInfo"] }
