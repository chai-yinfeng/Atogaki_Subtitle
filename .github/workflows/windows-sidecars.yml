name: Windows sidecars

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-sidecars.yml"
      - "LICENSE"
      - "about.hbs"
      - "about.toml"
      - "scripts/build-whisper-windows.ps1"
      - "scripts/build-ffmpeg-windows.sh"
      - "scripts/generate-frontend-licenses.mjs"
      - "scripts/package-sidecar-sources-windows.ps1"
      - "scripts/generate-rust-licenses-windows.ps1"
      - "scripts/smoke-test-nsis-windows.ps1"
      - "scripts/sidecar-versions.zsh"
      - "src-tauri/icons/**"
      - "src-tauri/tauri.windows.conf.json"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/windows-sidecars.yml"
      - "LICENSE"
      - "about.hbs"
      - "about.toml"
      - "scripts/build-whisper-windows.ps1"
      - "scripts/build-ffmpeg-windows.sh"
      - "scripts/generate-frontend-licenses.mjs"
      - "scripts/package-sidecar-sources-windows.ps1"
      - "scripts/generate-rust-licenses-windows.ps1"
      - "scripts/smoke-test-nsis-windows.ps1"
      - "scripts/sidecar-versions.zsh"
      - "src-tauri/icons/**"
      - "src-tauri/tauri.windows.conf.json"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing prerelease tag to publish; leave blank to build Artifacts only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-sidecars-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x86_64 sidecars
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache verified source archives
        uses: actions/cache@v5
        with:
          path: target/sidecar-source-cache
          key: windows-sidecar-sources-${{ hashFiles('scripts/sidecar-versions.zsh') }}

      - name: Restore audited sidecar build
        id: sidecar-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            src-tauri/binaries
            src-tauri/third-party/build-manifest.txt
            src-tauri/third-party/licenses
            target/release/bundle/sources
            target/windows-sidecars
          key: windows-sidecar-build-v1-${{ hashFiles('scripts/sidecar-versions.zsh', 'scripts/build-whisper-windows.ps1', 'scripts/build-ffmpeg-windows.sh', 'scripts/package-sidecar-sources-windows.ps1') }}

      - name: Set up MSYS2 UCRT64
        if: steps.sidecar-build-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf
            automake
            curl
            diffutils
            libtool
            make
            pkgconf
            tar
            xz
          pacboy: >-
            toolchain:p
            cmake:p
            meson:p
            ninja:p
            nasm:p

      - name: Build MSVC whisper sidecar
        if: steps.sidecar-build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-whisper-windows.ps1

      - name: Build and verify LGPL FFmpeg sidecars
        if: steps.sidecar-build-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build-ffmpeg-windows.sh

      - name: Package corresponding sources
        if: steps.sidecar-build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/package-sidecar-sources-windows.ps1

      - name: Save audited sidecar build
        if: steps.sidecar-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            src-tauri/binaries
            src-tauri/third-party/build-manifest.txt
            src-tauri/third-party/licenses
            target/release/bundle/sources
            target/windows-sidecars
          key: windows-sidecar-build-v1-${{ hashFiles('scripts/sidecar-versions.zsh', 'scripts/build-whisper-windows.ps1', 'scripts/build-ffmpeg-windows.sh', 'scripts/package-sidecar-sources-windows.ps1') }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Generate and verify frontend licenses
        run: |
          node ./scripts/generate-frontend-licenses.mjs
          git diff --exit-code -- src-tauri/third-party/frontend-licenses.html

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Cache Tauri build dependencies
        id: tauri-build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-tauri-nsis-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src/**/*.rs', 'src-tauri/src/**/*.rs', 'src-tauri/tauri*.json') }}
          restore-keys: windows-tauri-nsis-

      - name: Generate and verify Windows Rust licenses
        shell: pwsh
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          cargo install --locked --features cli --version 0.9.1 cargo-about
          ./scripts/generate-rust-licenses-windows.ps1
          git diff --exit-code -- src-tauri/third-party/rust-licenses-windows.html

      - name: Install pinned Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.0

      - name: Build unsigned NSIS installer
        working-directory: src-tauri
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          tauri build --bundles nsis --ci
          git diff --exit-code -- Cargo.lock

      - name: Save Tauri build dependencies
        if: steps.tauri-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-tauri-nsis-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src/**/*.rs', 'src-tauri/src/**/*.rs', 'src-tauri/tauri*.json') }}

      - name: Smoke-test NSIS install and uninstall
        shell: pwsh
        run: ./scripts/smoke-test-nsis-windows.ps1 -Installer "src-tauri/target/release/bundle/nsis/*-setup.exe"

      - name: Write NSIS checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          Set-Content -Path "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding ascii

      - name: Upload audited sidecar artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Atogaki-windows-x86_64-sidecars
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/binaries/*-x86_64-pc-windows-msvc.exe
            src-tauri/third-party/build-manifest.txt
            src-tauri/third-party/rust-licenses-windows.html
            src-tauri/third-party/licenses/
            target/release/bundle/sources/*.tar.gz
            target/release/bundle/sources/*.sha256

      - name: Upload unsigned NSIS test installer
        uses: actions/upload-artifact@v6
        with:
          name: Atogaki-windows-x86_64-unsigned-nsis
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sha256

  publish:
    name: Publish Windows prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download NSIS Artifact
        uses: actions/download-artifact@v8
        with:
          name: Atogaki-windows-x86_64-unsigned-nsis
          path: release-assets/installer

      - name: Download corresponding-source Artifact
        uses: actions/download-artifact@v8
        with:
          name: Atogaki-windows-x86_64-sidecars
          path: release-assets/sidecars

      - name: Verify and stage release assets
        id: release-assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-alpha\.\d+$') {
            throw "release_tag must look like v0.1.0-alpha.6"
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if (-not $tagCommit -or $tagCommit -ne $env:GITHUB_SHA) {
            throw "release tag $env:RELEASE_TAG must already exist and point to $env:GITHUB_SHA"
          }
          $notes = "docs/release-notes/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) {
            throw "release notes are missing: $notes"
          }

          $installer = Get-ChildItem "release-assets/installer/*-setup.exe" | Select-Object -First 1
          $installerChecksum = Get-ChildItem "release-assets/installer/*-setup.exe.sha256" | Select-Object -First 1
          $sources = Get-ChildItem "release-assets/sidecars" -Filter "*-third-party-sources.tar.gz" -Recurse | Select-Object -First 1
          $sourcesChecksum = Get-ChildItem "release-assets/sidecars" -Filter "*-third-party-sources.tar.gz.sha256" -Recurse | Select-Object -First 1
          foreach ($asset in @($installer, $installerChecksum, $sources, $sourcesChecksum)) {
            if (-not $asset) { throw "one or more required Windows release assets are missing" }
          }

          $expectedInstallerHash = (Get-Content $installerChecksum.FullName).Split()[0].ToLowerInvariant()
          $actualInstallerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          if ($actualInstallerHash -ne $expectedInstallerHash) { throw "NSIS checksum mismatch" }
          $expectedSourcesHash = (Get-Content $sourcesChecksum.FullName).Split()[0].ToLowerInvariant()
          $actualSourcesHash = (Get-FileHash -Algorithm SHA256 $sources.FullName).Hash.ToLowerInvariant()
          if ($actualSourcesHash -ne $expectedSourcesHash) { throw "corresponding-source checksum mismatch" }

          New-Item -ItemType Directory -Force "release-assets/staged" | Out-Null
          $releaseInstaller = "release-assets/staged/Atogaki-$env:RELEASE_TAG-windows-x86_64-setup.exe"
          Copy-Item $installer.FullName $releaseInstaller
          Set-Content "$releaseInstaller.sha256" "$actualInstallerHash  $(Split-Path -Leaf $releaseInstaller)" -Encoding ascii
          Copy-Item $sources.FullName "release-assets/staged/$($sources.Name)"
          Copy-Item $sourcesChecksum.FullName "release-assets/staged/$($sourcesChecksum.Name)"
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NOTES_FILE: ${{ steps.release-assets.outputs.notes }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw "release already exists: $env:RELEASE_TAG" }
          $assets = Get-ChildItem "release-assets/staged/*" | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --latest=false --title "Atogaki $env:RELEASE_TAG" --notes-file $env:NOTES_FILE
