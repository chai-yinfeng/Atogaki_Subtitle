[package]
name = "atogaki-subtitle"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["multipart"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "memmap"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
ttf-parser = "0.25.1"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
